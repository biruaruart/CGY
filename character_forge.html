<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色鍛造坊 Character Forge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --parchment:#f2e6c9;
    --parchment-dark:#e6d3a3;
    --parchment-shadow:#c9b581;
    --ink:#3a2a1a;
    --ink-soft:#5c4630;
    --gold:#b8892b;
    --gold-light:#e0b959;
    --wine:#7a2e2e;
    --forest:#4a5a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(255,255,255,0.08), transparent 60%),
      radial-gradient(ellipse at bottom right, rgba(0,0,0,0.12), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px),
      var(--parchment);
    color:var(--ink);
    font-family:'IM Fell English', serif;
    display:flex;
    justify-content:center;
    padding:32px 14px 60px;
  }

  .stage{
    width:100%;
    max-width:760px;
  }

  /* language toggle */
  .langbar{
    display:flex;
    justify-content:flex-end;
    margin-bottom:10px;
  }
  .langbtn{
    font-family:'Cinzel', serif;
    font-size:12px;
    letter-spacing:1px;
    background:var(--parchment-dark);
    border:1px solid var(--gold);
    color:var(--ink-soft);
    padding:6px 14px;
    border-radius:3px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .langbtn:hover{background:var(--gold-light); color:var(--ink);}

  /* ornate frame */
  .frame{
    position:relative;
    background:
      linear-gradient(160deg, rgba(255,255,255,0.15), transparent 40%),
      var(--parchment);
    border:1px solid var(--gold);
    box-shadow:0 0 0 5px var(--parchment), 0 0 0 6px var(--gold), 0 18px 40px rgba(58,42,26,0.35);
    padding:38px 30px 32px;
  }
  .frame::before, .frame::after,
  .frame .corner-br, .frame .corner-bl{
    content:"";
    position:absolute;
    width:26px; height:26px;
    border:2px solid var(--gold);
  }
  .frame::before{ top:8px; left:8px; border-right:none; border-bottom:none; }
  .frame::after{ top:8px; right:8px; border-left:none; border-bottom:none; }
  .corner-br{ bottom:8px; right:8px; border-left:none; border-top:none; }
  .corner-bl{ bottom:8px; left:8px; border-right:none; border-top:none; }

  h1{
    font-family:'Cinzel Decorative', serif;
    text-align:center;
    font-size:clamp(24px,4.5vw,34px);
    color:var(--wine);
    margin:0 0 4px;
    letter-spacing:1px;
  }
  .subtitle{
    text-align:center;
    font-family:'IM Fell English SC', serif;
    font-size:13px;
    letter-spacing:3px;
    color:var(--ink-soft);
    text-transform:uppercase;
    margin-bottom:26px;
  }

  .divider{
    display:flex; align-items:center; gap:10px;
    margin:30px 0 22px;
    color:var(--gold);
  }
  .divider::before, .divider::after{
    content:"";
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--gold), transparent);
  }
  .divider span{ font-size:18px; }

  section h2{
    font-family:'Cinzel', serif;
    font-size:16px;
    letter-spacing:2px;
    color:var(--ink);
    text-align:center;
    margin:0 0 4px;
  }
  section .hint{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    font-style:italic;
    margin:0 0 20px;
  }

  /* concept generator */
  .concept-display{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    padding:20px 14px;
    margin-bottom:18px;
    background:rgba(255,255,255,0.25);
    border:1px dashed var(--gold);
    border-radius:4px;
  }
  .word{
    cursor:pointer;
    font-family:'Cinzel', serif;
    font-weight:600;
    font-size:clamp(17px,3.4vw,23px);
    padding:6px 12px;
    border-radius:3px;
    transition:all .18s ease;
    position:relative;
    user-select:none;
  }
  .word .en{
    display:block;
    font-family:'IM Fell English', serif;
    font-weight:400;
    font-style:italic;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:2px;
  }
  .word.adj{ color:var(--forest); }
  .word.noun{ color:var(--wine); }
  .word.occ{ color:#8a5a1f; }
  .word:hover{ background:rgba(184,137,43,0.18); transform:translateY(-1px); }
  .word:hover::after{
    content:"⟲";
    position:absolute; top:-8px; right:-4px;
    font-size:11px; color:var(--gold);
  }
  .word.spin{ animation:flicker .25s steps(2) infinite; }
  @keyframes flicker{ 50%{ opacity:.35; } }

  .btnrow{ display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
  .mainbtn{
    font-family:'Cinzel', serif;
    letter-spacing:1px;
    font-size:14px;
    background:linear-gradient(180deg, var(--gold-light), var(--gold));
    border:1px solid #8a6620;
    color:#3a2a10;
    padding:10px 22px;
    border-radius:4px;
    cursor:pointer;
    box-shadow:0 2px 0 #8a6620;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .mainbtn:hover{ transform:translateY(-1px); }
  .mainbtn:active{ transform:translateY(1px); box-shadow:0 1px 0 #8a6620; }
  .mainbtn.secondary{
    background:linear-gradient(180deg,#fff,var(--parchment-dark));
    border:1px solid var(--gold);
    color:var(--ink-soft);
    box-shadow:0 2px 0 var(--gold);
  }

  /* dice section */
  .statgrid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-bottom:20px;
  }
  @media (max-width:520px){
    .statgrid{ grid-template-columns:repeat(2,1fr); }
  }
  .statcard{
    background:rgba(255,255,255,0.3);
    border:1px solid var(--gold);
    border-radius:5px;
    padding:12px 8px 10px;
    text-align:center;
    position:relative;
    min-height:118px;
  }
  .statcard .label{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:1px;
    color:var(--wine);
  }
  .statcard .label .en{
    display:block;
    font-family:'IM Fell English', serif;
    font-style:italic;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
  }
  .statcard .total{
    font-family:'Cinzel Decorative', serif;
    font-size:30px;
    color:var(--ink);
    margin:4px 0 0;
  }
  .statcard .mod{
    font-size:12px;
    color:var(--forest);
    font-family:'IM Fell English SC', serif;
  }
  .statcard .breakdown{
    font-size:10px;
    color:var(--ink-soft);
    margin-top:5px;
    letter-spacing:0.5px;
  }
  .statcard .breakdown .dropped{
    text-decoration:line-through;
    opacity:.45;
  }
  .statcard.rolling .total{ animation:flicker .12s steps(2) infinite; }

  footer{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    margin-top:26px;
    letter-spacing:1px;
    font-style:italic;
  }
</style>
</head>

<div class="stage">

    <button class="langbtn" id="langToggle">EN</button>
  </div>

      </div>
    </section>

    <footer id="footerNote">為角色設計與世界觀創作而生 · 可自由嵌入你的網站</footer>
  </div>
</div>

let lang = "zh";
let current = { adj:0, noun:0, occ:0 };
let statResults = {}; // key -> {rolls:[..], dropped:idx, total, mod}

function rand(n){ return Math.floor(Math.random()*n); }

function pickIndex(category){
  current[category] = rand(DATA[category].zh.length);
}

function renderConcept(){
  const el = document.getElementById('conceptDisplay');
  el.innerHTML = "";
  const order = ["adj","noun","occ"];
  const cls = {adj:"adj", noun:"noun", occ:"occ"};
  order.forEach(cat=>{
    const zhWord = DATA[cat].zh[current[cat]];
    const enWord = DATA[cat].en[current[cat]];
    const span = document.createElement('span');
    span.className = "word " + cls[cat];
    span.dataset.cat = cat;
    if(lang === "zh"){
      span.innerHTML = zhWord + '<span class="en">'+enWord+'</span>';
    } else {
      span.innerHTML = enWord + '<span class="en">'+zhWord+'</span>';
    }
    span.title = lang==="zh" ? "點擊重擲此詞" : "Click to reroll";
    span.addEventListener('click', ()=> rerollOne(cat, span));
    el.appendChild(span);
  });
}

function rerollOne(cat, span){
  span.classList.add('spin');
  let ticks = 0;
  const iv = setInterval(()=>{
    pickIndex(cat);
    renderConceptWordOnly(cat, span);
    ticks++;
    if(ticks > 6){
      clearInterval(iv);
      span.classList.remove('spin');
    }
  }, 55);
}

function renderConceptWordOnly(cat, span){
  const zhWord = DATA[cat].zh[current[cat]];
  const enWord = DATA[cat].en[current[cat]];
  if(lang === "zh"){
    span.innerHTML = zhWord + '<span class="en">'+enWord+'</span>';
  } else {
    span.innerHTML = enWord + '<span class="en">'+zhWord+'</span>';
  }
}

function rerollAllConcept(){
  ["adj","noun","occ"].forEach(cat=> pickIndex(cat));
  renderConcept();
}

function rollOneStat(){
  const rolls = [rand(6)+1, rand(6)+1, rand(6)+1, rand(6)+1];
  let minVal = Math.min(...rolls);
  let droppedIdx = rolls.indexOf(minVal);
  const total = rolls.reduce((a,b)=>a+b,0) - minVal;
  const mod = Math.floor((total-10)/2);
  return { rolls, droppedIdx, total, mod };
}

    const labelSub = lang === "zh" ? s.en : s.zh;
    let totalHTML = "—";
    let modHTML = "";
    let breakdownHTML = lang==="zh" ? "尚未擲骰" : "not rolled yet";
    if(res){
      totalHTML = res.total;
      modHTML = (res.mod>=0? "+":"") + res.mod;
      breakdownHTML = res.rolls.map((r,i)=> i===res.droppedIdx ? '<span class="dropped">'+r+'</span>' : r).join(" · ");
    }
    card.innerHTML = `
      <div class="label">${label}<span class="en">${labelSub}</span></div>
      <div class="total">${totalHTML}</div>
      <div class="mod">${modHTML}</div>
      <div class="breakdown">${breakdownHTML}</div>
    `;
    grid.appendChild(card);
  });
}

function rollAllStats(){
  STATS.forEach(s=>{
    const card = document.getElementById('stat-' + s.key);
    if(card) card.classList.add('rolling');
  });
  let ticks = 0;
  const iv = setInterval(()=>{
    STATS.forEach(s=>{ statResults[s.key] = rollOneStat(); });
    renderStatGrid();
    ticks++;
    if(ticks > 5){
      clearInterval(iv);
      document.querySelectorAll('.statcard').forEach(c=>c.classList.remove('rolling'));
    }
  }, 70);
}

function applyLangText(){
  const t = TEXT[lang];
  document.getElementById('mainTitle').textContent = t.title;
  document.getElementById('mainSubtitle').textContent = t.subtitle;
  document.getElementById('conceptTitle').textContent = t.conceptTitle;
  document.getElementById('conceptHint').textContent = t.conceptHint;
  document.getElementById('rerollAllConcept').textContent = t.rerollAll;
  document.getElementById('statTitle').textContent = t.statTitle;
  document.getElementById('statHint').textContent = t.statHint;
  document.getElementById('rollAllStats').textContent = t.rollStats;
  document.getElementById('footerNote').textContent = t.footer;
  document.getElementById('langToggle').textContent = t.langBtn;
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
}

document.getElementById('langToggle').addEventListener('click', ()=>{
  lang = lang === "zh" ? "en" : "zh";
  applyLangText();
  renderConcept();
  renderStatGrid();
});

document.getElementById('rerollAllConcept').addEventListener('click', rerollAllConcept);
document.getElementById('rollAllStats').addEventListener('click', rollAllStats);

// init
rerollAllConcept();
renderStatGrid();
applyLangText();
</script>
</body>
</html>
